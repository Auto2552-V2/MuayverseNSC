<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muayverse Pose Detector — หน้าทดสอบ</title>
<!--
  หน้าทดสอบ AI detection แบบไม่ต้องมี Unity

  ใช้ยืนยันสามอย่างก่อนไปต่อฝั่งเกม:
    1. โมเดลโหลดได้ และ shape ตรงกับ meta.json
    2. ท่าทั้ง 5 ถูกจำแนกถูกจริง (ดูแถบความมั่นใจ)
    3. ตัวกรอง (threshold / consensus / lock) ส่งท่าออกครั้งเดียวต่อหนึ่งหมัด
       ไม่ใช่ส่งรัว ๆ สามสิบครั้ง

  วิธีรัน — ต้องผ่าน http:// ไม่ใช่เปิดไฟล์ตรง ๆ (getUserMedia ต้องการ secure context
  ซึ่ง localhost นับว่าใช่ แต่ file:// ไม่นับ):

      cd Muayverse_Remake
      .venv/Scripts/python.exe -m http.server 8000
      เปิด http://localhost:8000/web/

  อยากเห็นว่า Unity จะได้อะไร ให้เปิดอีกหน้าต่าง:
      node scripts/mock_unity_ws.mjs
-->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #272b35;
    --text: #e7e9ee; --dim: #9aa1ad; --accent: #4da3ff;
    --ok: #3ddc84; --warn: #ffb02e; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 16px; font-size: 13px; }
  .wrap { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 16px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  #stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  /* <video> เป็นแค่แหล่งภาพดิบ ไม่โชว์ — ภาพที่โชว์คือ canvas ที่พลิกแล้วจาก
     detector.mirrorCanvas ซึ่งเป็นภาพเดียวกับที่ MediaPipe เห็น
     ห้ามใช้ CSS transform: scaleX(-1) ที่นี่ ไม่งั้นพิกัด landmark จะไม่ตรงกับภาพ
     (ภาพพลิกสองรอบ = กลับมาไม่พลิก แต่ skeleton พลิกรอบเดียว → ไม่ทับตัวคน) */
  #stage video { display: none; }
  #stage canvas { width: 100%; display: block; }
  #overlay { position: absolute; inset: 0; }
  button {
    background: var(--accent); color: #06101d; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #333843; color: var(--dim); cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar { margin-bottom: 7px; }
  .bar .lbl { display: flex; justify-content: space-between; font-size: 12px;
              margin-bottom: 3px; color: var(--dim); }
  .bar .track { height: 9px; background: #0b0d11; border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .06s linear; }
  .bar.hot .lbl { color: var(--text); font-weight: 600; }
  .bar.hot .fill { background: var(--ok); }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
         max-height: 260px; overflow-y: auto; }
  #log div { padding: 3px 0; border-bottom: 1px solid var(--line); }
  #log .t { color: var(--dim); }
  #log .p { color: var(--ok); font-weight: 600; }
  #status { font-size: 12px; color: var(--dim); white-space: pre-wrap;
            font-family: ui-monospace, Consolas, monospace;
            max-height: 150px; overflow-y: auto; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px;
          border: 1px solid var(--line); color: var(--dim); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .note { font-size: 12px; color: var(--warn); margin-top: 10px; }
  label.cfg { font-size: 12px; color: var(--dim); display: flex;
              justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  label.cfg input { width: 72px; background: #0b0d11; color: var(--text);
                    border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
</style>
</head>
<body>

<h1>Muayverse Pose Detector</h1>
<div class="sub">MediaPipe Pose + LSTM — ทดสอบการจำแนกท่าและตัวกรองก่อนต่อเข้า Unity</div>

<div class="wrap">
  <div>
    <div class="panel">
      <div class="row">
        <button id="btnStart">เริ่มกล้อง</button>
        <button id="btnStop" disabled>หยุด</button>
        <span class="pill" id="pillWs">WebSocket: —</span>
        <span class="pill" id="pillFps">— fps</span>
        <span class="pill" id="pillPose">กล้อง: —</span>
      </div>
      <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="note" id="note"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>ท่าที่ส่งออกไปให้ Unity</h2>
      <div id="log"><div class="t">ยังไม่มี — ลองออกหมัดดู</div></div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>ความมั่นใจของแต่ละคลาส</h2>
      <div id="bars"><div class="sub">รอเริ่มกล้อง…</div></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>ตัวกรอง (ปรับได้สด)</h2>
      <label class="cfg">threshold <input id="cfgThreshold" type="number" step="0.05" min="0" max="1"></label>
      <label class="cfg">consensus (เฟรม) <input id="cfgConsensus" type="number" step="1" min="1"></label>
      <label class="cfg">releaseFrames <input id="cfgRelease" type="number" step="1" min="1"></label>
      <label class="cfg">cooldown (ms) <input id="cfgCooldown" type="number" step="50" min="0"></label>
      <label class="cfg">minPresenceRatio <input id="cfgPresence" type="number" step="0.05" min="0" max="1"></label>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>สถานะ</h2>
      <div id="status">รอเริ่ม…</div>
    </div>
  </div>
</div>

<script src="vendor/tf.min.js"
        onerror="var s=document.createElement('script');
                 s.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
                 document.head.appendChild(s);"></script>
<script type="module">
import { PoseDetector, transportFromUrl } from './pose-detector.js';

// เส้นทางไฟล์ทั้งหมดอ้างจาก repo root ที่ http.server เสิร์ฟอยู่ (หน้านี้อยู่ /web/)
const detector = new PoseDetector({
  modelUrl: '../tfjs_build/pose_action/model/model.json',
  metaUrl: '../tfjs_build/pose_action/meta.json',
  poseModelUrl: 'models/pose_landmarker_full.task',
  // สลับปลายทางได้ด้วย ?transport=... โดยไม่ต้องแก้ไฟล์ (ดู transportFromUrl)
  // รัวหมัดเดิมติดกันแล้วให้นับทุกหมัด — 0 = ปิด (หมัดเดิมที่ค้างไว้จะนับครั้งเดียว)
  repeatSameAfterMs: 500,
  transport: transportFromUrl('auto'),
  wsUrl: 'ws://127.0.0.1:8787',
  // ส่งให้ Unity ด้วย เผื่อเปิดหน้านี้คู่กับ Editor — หน้านี้โชว์กล้องอยู่แล้วก็จริง
  // แต่ถ้าไม่เปิด แล้วไปทดสอบ PoseCameraPreview ด้วยหน้านี้ จะงงว่าทำไมภาพไม่ขึ้น
  reportLivePose: true,
  sendPreviewToUnity: true,
});

const $ = (id) => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), ctx = overlay.getContext('2d');

// ── สถานะ ──
const statusLines = [];
detector.onStatus = (msg) => {
  statusLines.push(msg);
  $('status').textContent = statusLines.slice(-12).join('\n');
};

// ── แถบความมั่นใจ ──
let barEls = null;
detector.onProbabilities = (probs, actions) => {
  if (!barEls) {
    $('bars').innerHTML = '';
    barEls = actions.map((name) => {
      const el = document.createElement('div');
      el.className = 'bar';
      el.innerHTML = `<div class="lbl"><span>${name}</span><span class="v">0%</span></div>
                      <div class="track"><div class="fill"></div></div>`;
      $('bars').appendChild(el);
      return el;
    });
  }
  let best = 0;
  for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
  const anyProb = probs.some((p) => p > 0);
  probs.forEach((p, i) => {
    barEls[i].querySelector('.fill').style.width = (p * 100).toFixed(1) + '%';
    barEls[i].querySelector('.v').textContent = (p * 100).toFixed(0) + '%';
    barEls[i].classList.toggle('hot', anyProb && i === best);
  });
  countFrame();
};

// ── ไม่เห็นคนในกล้อง ──
// ต้องโชว์ให้ชัด เพราะอาการ "ออกหมัดแล้วเกมไม่รับ" มักไม่ใช่โมเดลพัง แต่เป็น
// คนยืนหลุดเฟรม/แสงน้อย แล้ว MediaPipe หา landmark ไม่เจอ
detector.onNoPose = (ratio) => {
  const p = $('pillPose');
  p.textContent = `กล้อง: ไม่เห็นคน (${(ratio * 100).toFixed(0)}%)`;
  p.className = 'pill off';
  countFrame();
};
setInterval(() => {
  if (!detector.running) return;
  const p = $('pillPose');
  if (detector.presenceRatio >= detector.cfg.minPresenceRatio) {
    p.textContent = `กล้อง: เห็นคน (${(detector.presenceRatio * 100).toFixed(0)}%)`;
    p.className = 'pill on';
  }
}, 300);

// ── log ท่าที่ส่งออก ──
let emitted = 0;
detector.onPose = ({ pose, confidence }) => {
  if (emitted++ === 0) $('log').innerHTML = '';
  const t = new Date().toLocaleTimeString('th-TH', { hour12: false });
  const row = document.createElement('div');
  row.innerHTML = `<span class="t">${t}</span>  <span class="p">${pose}</span>
                   <span class="t">conf ${confidence.toFixed(3)}</span>
                   <span class="t">#${emitted}</span>`;
  $('log').prepend(row);
};

// ── fps ──
let frames = 0, fpsAt = performance.now();
function countFrame() {
  frames++;
  const now = performance.now();
  if (now - fpsAt >= 1000) {
    $('pillFps').textContent = `${(frames * 1000 / (now - fpsAt)).toFixed(0)} fps`;
    frames = 0; fpsAt = now;
  }
}

// ── โครงกระดูกคร่าว ๆ ให้เห็นว่า MediaPipe จับติดไหม ──
// วาดจาก rawBuffer เฟรมล่าสุด (ค่าที่ mirror แล้ว) จึงตรงกับที่โมเดลเห็นจริง
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
let viewAttached = false;
function drawSkeleton() {
  if (!detector.running) return;

  // เอาภาพที่พลิกแล้วของ detector มาโชว์ตรง ๆ — ไม่สร้าง canvas ซ้ำ ไม่พลิกด้วย CSS
  // ที่เห็นบนจอจึงเป็นภาพเดียวกับที่โมเดลเห็น พิกัด landmark ทับตัวคนพอดีโดยไม่ต้องแปลงอะไร
  if (!viewAttached && detector.mirrorCanvas) {
    detector.mirrorCanvas.id = 'view';
    $('stage').insertBefore(detector.mirrorCanvas, overlay);
    viewAttached = true;
  }

  const w = video.videoWidth, h = video.videoHeight;
  if (w && (overlay.width !== w || overlay.height !== h)) { overlay.width = w; overlay.height = h; }
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const raw = detector.rawBuffer.at(-1);
  if (raw) {
    const px = (i) => [raw[i*4] * overlay.width, raw[i*4+1] * overlay.height];
    ctx.strokeStyle = '#4da3ff'; ctx.lineWidth = 3;
    for (const [a, b] of BONES) {
      const [x1,y1] = px(a), [x2,y2] = px(b);
      if (!x1 && !y1) continue;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    ctx.fillStyle = '#3ddc84';
    for (const i of [11,12,13,14,15,16,19,20,23,24]) {
      const [x,y] = px(i);
      if (!x && !y) continue;
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    }
  }
  requestAnimationFrame(drawSkeleton);
}

// ── ช่องปรับค่าตัวกรอง ──
const bindings = [
  ['cfgThreshold', 'threshold', Number],
  ['cfgConsensus', 'consensus', (v) => Math.max(1, parseInt(v, 10) || 1)],
  ['cfgRelease', 'releaseFrames', (v) => Math.max(1, parseInt(v, 10) || 1)],
  ['cfgCooldown', 'emitCooldownMs', (v) => Math.max(0, parseInt(v, 10) || 0)],
  ['cfgPresence', 'minPresenceRatio', Number],
];
for (const [id, key, parse] of bindings) {
  $(id).value = detector.cfg[key];
  $(id).addEventListener('change', (e) => { detector.cfg[key] = parse(e.target.value); });
}

// ── สถานะ WebSocket ──
setInterval(() => {
  const p = $('pillWs');
  if (detector.wsReady) { p.textContent = 'WebSocket: ต่อแล้ว'; p.className = 'pill on'; }
  else if (detector.ws) { p.textContent = 'WebSocket: กำลังต่อ…'; p.className = 'pill'; }
  else { p.textContent = 'WebSocket: ปิด'; p.className = 'pill off'; }
}, 500);

// ── ปุ่ม ──
$('btnStart').addEventListener('click', async () => {
  $('btnStart').disabled = true;
  try {
    await detector.init();
    await detector.start(video);
    $('btnStop').disabled = false;
    drawSkeleton();
  } catch (e) {
    $('note').textContent = 'เริ่มไม่สำเร็จ: ' + e.message;
    $('btnStart').disabled = false;
    console.error(e);
  }
});
$('btnStop').addEventListener('click', () => {
  detector.stop();
  if (viewAttached) { detector.mirrorCanvas.remove(); viewAttached = false; }
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  $('btnStop').disabled = true;
  $('btnStart').disabled = false;
});
</script>
</body>
</html>
